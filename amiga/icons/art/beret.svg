<?xml version="1.0" encoding="UTF-8"?>
<!-- Beret's GlowIcon art: a round little hero in a green beret on a stone
     block, lifting a crate by telekinesis. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="body" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.6" stop-color="#f0c890"/>
      <stop offset="1" stop-color="#b07840"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad04a"/>
      <stop offset="1" stop-color="#1f7a24"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0b0"/>
      <stop offset="1" stop-color="#4c5060"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a050"/>
      <stop offset="1" stop-color="#8a5020"/>
    </linearGradient>
  </defs>
  <!-- stone block -->
  <rect x="10" y="100" width="76" height="24" rx="3" fill="url(#stone)" stroke="#2a2c34" stroke-width="2"/>
  <path d="M10 112 H86 M36 100 V112 M60 112 V124" stroke="#2a2c34" stroke-width="1.5" fill="none"/>
  <!-- telekinesis beam -->
  <path d="M62 62 Q84 50 96 34" stroke="#b070ff" stroke-width="4" fill="none" stroke-dasharray="5 4" opacity="0.85"/>
  <!-- crate -->
  <g transform="rotate(-10 102 24)">
    <rect x="86" y="8" width="32" height="32" rx="2" fill="url(#crate)" stroke="#4a2808" stroke-width="2.5"/>
    <path d="M86 8 L118 40 M118 8 L86 40" stroke="#4a2808" stroke-width="2"/>
  </g>
  <circle cx="102" cy="24" r="22" fill="none" stroke="#c090ff" stroke-width="2" opacity="0.6"/>
  <!-- hero -->
  <ellipse cx="46" cy="100" rx="22" ry="4" fill="#000" opacity="0.3"/>
  <circle cx="46" cy="74" r="25" fill="url(#body)" stroke="#5a3010" stroke-width="2.5"/>
  <ellipse cx="38" cy="72" rx="4" ry="6" fill="#202020"/>
  <ellipse cx="54" cy="72" rx="4" ry="6" fill="#202020"/>
  <circle cx="39.5" cy="70" r="1.5" fill="#fff"/>
  <circle cx="55.5" cy="70" r="1.5" fill="#fff"/>
  <!-- beret -->
  <path d="M18 56 Q22 34 50 36 Q76 38 74 54 Q60 50 46 52 Q30 52 18 56 Z" fill="url(#hat)" stroke="#0e4012" stroke-width="2.5"/>
  <path d="M50 36 L54 30" stroke="#0e4012" stroke-width="3" stroke-linecap="round"/>
</svg>
